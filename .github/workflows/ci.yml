name: CodeDoctor CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python test dependencies
        run: python -m pip install -r requirements.txt
      - name: Install evaluation dependencies
        run: python -m pip install -r requirements-eval.txt
      - name: Run Python tests
        run: pytest -q
      - name: Compile Python modules
        run: python -m compileall -q app scripts tests
      - name: Build C++ product
        run: make -B
      - name: Run C++ tests
        run: make -B test
      - name: Run local evaluation
        run: python scripts/evaluate.py scripts/sample_eval.jsonl --output build/sample_results.json
      - name: Validate result artifact
        run: python scripts/validate_submission.py build/sample_results.json
