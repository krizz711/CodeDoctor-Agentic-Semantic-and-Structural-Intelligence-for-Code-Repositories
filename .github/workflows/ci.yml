name: CI

# Fast, hermetic, and green or genuinely broken -- nothing in between.
#
# The previous version failed on every push for two reasons that had nothing to
# do with the code:
#
#   1. It ran `pytest -m "not model"`, which still selects the four tests marked
#      `data`. Those need the real CoIR AppsRetrieval split, and `artifacts/` is
#      not tracked, so on a clean runner they tried to pull the dataset from
#      HuggingFace mid-test. A CI job whose result depends on a third-party
#      download is a coin toss, not a check.
#   2. It installed requirements-eval.txt -- torch with CUDA wheels, faiss, mteb
#      and datasets -- to run tests that touch none of them.
#
# So this job deselects both markers, installs only what the selected tests
# import, and takes the CPU-only torch wheel (~180 MB rather than ~2.5 GB).
# The tests that need weights or the dataset are not skipped silently: they run
# locally and in the Kaggle reproduction notebook, and README section 8 says so.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, lint, and the C++ core
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # The repository indexes its own git history. A shallow clone would
          # leave the version-isolation tests exercising a single snapshot
          # while still reporting success.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Tests
        run: pytest -q -m "not model and not data"

      - name: Compile every module
        run: python -m compileall -q app scripts tests

      - name: Dead code
        run: |
          python -m pip install ruff
          ruff check app scripts tests --select F401,F811

      - name: C++ core
        run: |
          make -B
          make -B test

      - name: Evaluation harness end to end
        run: |
          python scripts/evaluate.py scripts/sample_eval.jsonl --output build/sample_results.json
          python scripts/validate_submission.py build/sample_results.json

      - name: The submitted artifact is still valid
        run: python scripts/validate_submission.py appsretrieval_results.json

      - name: Retrieval on an unseen repository
        run: python scripts/judge_endtoend.py --repo test_repos/commander
